# Builds this branch's amd64 Kata assets for qualification. The image gets only
# a commit-derived tag, so this workflow cannot overwrite a release or `latest`.
name: Build qualification kata-deploy

on: workflow_dispatch

permissions: {}

jobs:
  lock:
    name: verify-qualification-lock
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      guest-components-revision: ${{ steps.guest.outputs.revision }}
      guest-components-toolchain: ${{ steps.guest.outputs.toolchain }}
    steps:
      - name: Check out qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify guest-components revision
        id: guest
        run: |
          set -euo pipefail
          expected=0aa86474c6d3d49c23f6033b49d2591d831fa79d
          expected_toolchain=1.95.0
          revision=$(awk '
            $1 == "coco-guest-components:" { component = 1; next }
            component && $1 == "version:" {
              gsub(/"/, "", $2)
              print $2
              exit
            }
          ' versions.yaml)
          toolchain=$(awk '
            $1 == "coco-guest-components:" { component = 1; next }
            component && $1 == "toolchain:" {
              gsub(/"/, "", $2)
              print $2
              exit
            }
          ' versions.yaml)
          if [[ $revision != "$expected" ]]; then
            printf 'versions.yaml does not match the qualification guest-components lock\n' >&2
            exit 1
          fi
          if [[ $toolchain != "$expected_toolchain" ]]; then
            printf 'versions.yaml does not match the qualification guest-components toolchain\n' >&2
            exit 1
          fi
          printf 'revision=%s\n' "$revision" >>"$GITHUB_OUTPUT"
          printf 'toolchain=%s\n' "$toolchain" >>"$GITHUB_OUTPUT"

  build-assets:
    name: build-amd64-assets
    needs: lock
    permissions:
      contents: read # The reusable workflow checks out this revision.
      packages: write # Required by the reusable static-build workflow.
      id-token: write # Required by the reusable static-build workflow.
      attestations: write # Required by the reusable static-build workflow.
    uses: ./.github/workflows/build-kata-static-tarball-amd64.yaml
    with:
      # Upload assets as workflow artifacts only; do not push to a registry
      # (this also avoids the quay.io login in the build workflow).
      push-to-registry: "no"
      commit-hash: ${{ github.sha }}
    secrets:
      KBUILD_SIGN_PIN: ${{ secrets.KBUILD_SIGN_PIN }}

  publish:
    name: publish-kata-deploy-to-ghcr
    needs:
      - lock
      - build-assets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out qualification source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reclaim hosted-runner space
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet

      - name: Download amd64 assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: kata-artifacts-amd64-*
          path: tools/packaging/kata-deploy/local-build/build
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Sign in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only the qualification kata-deploy image
        id: image
        env:
          GUEST_COMPONENTS_REVISION: ${{ needs.lock.outputs.guest-components-revision }}
          GUEST_COMPONENTS_TOOLCHAIN: ${{ needs.lock.outputs.guest-components-toolchain }}
        run: |
          set -euo pipefail
          build=tools/packaging/kata-deploy/local-build/build
          stage=tools/packaging/kata-deploy/kata-artifacts
          if [[ -e $stage ]]; then
            printf 'kata artifact stage unexpectedly exists in the checkout\n' >&2
            exit 1
          fi
          install -d -m 0755 "$stage"
          cleanup() {
            find "$stage" -mindepth 1 -maxdepth 1 -type f -delete
            rmdir "$stage"
          }
          trap cleanup EXIT

          if ! compgen -G "$build/kata-static-*.tar.zst" >/dev/null ||
            ! compgen -G "$build/kata-deploy-static-*.tar.zst" >/dev/null; then
            printf 'downloaded workflow artifacts are incomplete\n' >&2
            exit 1
          fi
          cp "$build"/kata-static-*.tar.zst "$stage"/
          cp "$build"/kata-deploy-static-*.tar.zst "$stage"/

          image="ghcr.io/akash-network/kata-deploy:qualification-${GITHUB_SHA}"
          metadata="$RUNNER_TEMP/kata-deploy-image-metadata.json"
          docker buildx build \
            --platform linux/amd64 \
            --file tools/packaging/kata-deploy/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/akash-network/kata-containers \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "io.akash.kata.guest-components-revision=$GUEST_COMPONENTS_REVISION" \
            --label "io.akash.kata.guest-components-toolchain=$GUEST_COMPONENTS_TOOLCHAIN" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "$metadata" \
            --tag "$image" \
            --push \
            .

          digest=$(jq -er '.["containerimage.digest"]' "$metadata")
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'build did not return an OCI manifest digest\n' >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"
          printf 'image=%s\n' "$image" >>"$GITHUB_OUTPUT"

  record:
    name: record-immutable-image
    needs:
      - lock
      - publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Sign in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify embedded guest-components artifact
        id: guest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          EXPECTED_REVISION: ${{ needs.lock.outputs.guest-components-revision }}
          EXPECTED_TOOLCHAIN: ${{ needs.lock.outputs.guest-components-toolchain }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          image_ref="$IMAGE@$DIGEST"
          docker pull "$image_ref" >/dev/null
          container=$(docker create "$image_ref")
          cleanup() {
            docker container rm "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          extract="$RUNNER_TEMP/kata-deploy-lock"
          install -d -m 0755 "$extract"
          docker cp \
            "$container:/opt/kata-artifacts/versions.yaml" \
            "$extract/versions.yaml"
          docker cp \
            "$container:/opt/kata-artifacts/tarballs/kata-static-coco-guest-components.tar.zst" \
            "$extract/guest-components.tar.zst"
          embedded_revision=$(awk '
            $1 == "coco-guest-components:" { component = 1; next }
            component && $1 == "version:" {
              gsub(/"/, "", $2)
              print $2
              exit
            }
          ' "$extract/versions.yaml")
          embedded_toolchain=$(awk '
            $1 == "coco-guest-components:" { component = 1; next }
            component && $1 == "toolchain:" {
              gsub(/"/, "", $2)
              print $2
              exit
            }
          ' "$extract/versions.yaml")
          if [[ $embedded_revision != "$EXPECTED_REVISION" ]]; then
            printf 'kata-deploy image contains the wrong guest-components revision\n' >&2
            exit 1
          fi
          if [[ $embedded_toolchain != "$EXPECTED_TOOLCHAIN" ]]; then
            printf 'kata-deploy image contains the wrong guest-components toolchain\n' >&2
            exit 1
          fi
          archive_sha256=$(sha256sum "$extract/guest-components.tar.zst" | awk '{ print $1 }')
          if [[ ! $archive_sha256 =~ ^[0-9a-f]{64}$ ]]; then
            printf 'guest-components tarball did not return a SHA-256 digest\n' >&2
            exit 1
          fi
          printf 'archive-sha256=%s\n' "$archive_sha256" >>"$GITHUB_OUTPUT"

      - name: Record immutable output
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GUEST_COMPONENTS_ARCHIVE_SHA256: ${{ steps.guest.outputs.archive-sha256 }}
          IMAGE: ${{ needs.publish.outputs.image }}
          GUEST_COMPONENTS_REVISION: ${{ needs.lock.outputs.guest-components-revision }}
          GUEST_COMPONENTS_TOOLCHAIN: ${{ needs.lock.outputs.guest-components-toolchain }}
        run: |
          # Backticks below are Markdown delimiters, not command substitutions.
          # shellcheck disable=SC2016
          {
            printf '## Qualification kata-deploy image\n\n'
            printf -- '- Image: `%s`\n' "$IMAGE"
            printf -- '- Digest: `%s`\n' "$DIGEST"
            printf -- '- Source: `%s`\n' "$GITHUB_SHA"
            printf -- '- guest-components: `%s`\n' "$GUEST_COMPONENTS_REVISION"
            printf -- '- guest-components Rust toolchain: `%s`\n' "$GUEST_COMPONENTS_TOOLCHAIN"
            printf -- '- guest-components tarball SHA-256: `%s`\n' \
              "$GUEST_COMPONENTS_ARCHIVE_SHA256"
            printf '\nNo release, Git tag, or mutable image tag was created.\n'
          } >>"$GITHUB_STEP_SUMMARY"
